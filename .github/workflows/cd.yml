# Пояснения моего CD для проекта ниже

name: CD Pipeline (Google Cloud Run)

on:
  push:
    branches: [main] # Триггер только при слиянии/пуше в ветку main

jobs:
  deploy:
    name: Build & Deploy to Cloud Run
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. Аутентификация в Google Cloud Platform
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      # 2. Установка gcloud CLI для работы с командами gcloud
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      # 3. Настройка аутентификации Docker для Artifact Registry
      - name: Configure Docker Auth for GCP
        run: |
          gcloud auth configure-docker ${{ secrets.GCP_REGION }}-docker.pkg.dev --quiet

      # === СБОРКА И ДЕПЛОЙ БЭКЕНДА ===
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven

      - name: Build Backend JAR
        run: ./mvnw clean package -Dmaven.test.skip=true
        working-directory: backend

      - name: Build and Push Backend Docker Image
        run: |
          IMAGE_TAG="${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/careerpilot-docker-repo/backend:latest"
          docker build -t $IMAGE_TAG -f backend/Dockerfile backend
          docker push $IMAGE_TAG

      - name: Deploy Backend to Cloud Run
        id: deploy-backend
        run: |
          gcloud run deploy careerpilot-backend \
            --image=${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/careerpilot-docker-repo/backend:latest \
            --region=${{ secrets.GCP_REGION }} \
            --platform=managed \
            --allow-unauthenticated \
            --add-cloudsql-instances=${{ secrets.GCP_PROJECT_ID }}:europe-west3:careerpilot-db \
            --update-env-vars="SPRING_PROFILES_ACTIVE=prod,SERVER_PORT=8080,SPRING_CACHE_TYPE=none,TELEGRAM_BOT_ENABLED=true,TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }},SPRING_DATASOURCE_URL=jdbc:postgresql:///careerpilot_ai?socketFactory=com.google.cloud.sql.postgres.SocketFactory&cloudSqlInstance=${{ secrets.GCP_PROJECT_ID }}:europe-west3:careerpilot-db&currentSchema=careerpilot,SPRING_DATASOURCE_USERNAME=${{ secrets.DATABASE_USERNAME }},SPRING_DATASOURCE_PASSWORD=${{ secrets.DATABASE_PASSWORD }},SPRING_DATA_REDIS_HOST=${{ secrets.REDIS_HOST }},ENCRYPTION_MASTER_KEY=${{ secrets.ENCRYPTION_MASTER_KEY }},JWT_SECRET=${{ secrets.JWT_SECRET }},FRONTEND_URL=https://careerpilot-ai.ru,GOOGLE_CALENDAR_REDIRECT_URI=https://careerpilot-backend-213199819151.europe-west1.run.app/api/integrations/google-calendar/callback,GITHUB_CLIENT_ID=${{ secrets.GH_CLIENT_ID }},GITHUB_CLIENT_SECRET=${{ secrets.GH_CLIENT_SECRET }},GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }},GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }},MAIL_HOST=smtp.resend.com,MAIL_PORT=587,MAIL_USERNAME=resend,MAIL_PASSWORD=${{ secrets.MAIL_PASSWORD }},MAIL_FROM=support@careerpilot-ai.ru" \
            --format="value(status.url)" > backend_url.txt
          echo "BACKEND_URL=$(cat backend_url.txt)" >> $GITHUB_ENV

      # === СБОРКА И ДЕПЛОЙ ФРОНТЕНДА ===
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install Frontend Dependencies
        run: pnpm install --frozen-lockfile
        working-directory: frontend

      # Мы собираем фронтенд, передавая URL бэкенда в качестве аргумента сборки
      - name: Build and Push Frontend Docker Image
        run: |
          IMAGE_TAG="${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/careerpilot-docker-repo/frontend:latest"
          docker build \
            --build-arg VITE_API_BASE_URL=https://careerpilot-backend-213199819151.europe-west1.run.app/api \
            -t $IMAGE_TAG \
            -f frontend/Dockerfile \
            frontend/
          docker push $IMAGE_TAG

      - name: Deploy Frontend to Cloud Run
        run: |
          gcloud run deploy careerpilot-frontend \
            --image=${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/careerpilot-docker-repo/frontend:latest \
            --region=${{ secrets.GCP_REGION }} \
            --platform=managed \
            --allow-unauthenticated \
            --port=80
