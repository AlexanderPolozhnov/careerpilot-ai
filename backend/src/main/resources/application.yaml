server:
  port: ${PORT:8080}
  forward-headers-strategy: native

spring:
  application:
    name: careerpilot-ai
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev,local}

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/${DB_NAME:careerpilot_ai}?currentSchema=careerpilot
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:admin}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_schema: careerpilot
        jdbc:
          batch_size: 25
        order_inserts: true
        order_updates: true

  flyway:
    enabled: true
    default-schema: careerpilot
    schemas: careerpilot
    locations:
      - classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  cache:
    type: ${SPRING_CACHE_TYPE:redis}
    redis:
      time-to-live: 24h
      cache-null-values: false

  security:
    oauth2:
      client:
        registration:
          github:
            client-id: ${GITHUB_CLIENT_ID:placeholder}
            client-secret: ${GITHUB_CLIENT_SECRET:placeholder}
            scope:
              - read:user
              - user:email
          google:
            client-id: ${GOOGLE_CLIENT_ID:placeholder}
            client-secret: ${GOOGLE_CLIENT_SECRET:placeholder}
            scope:
              - email
              - profile

  mail:
    host: ${MAIL_HOST:smtp.mailtrap.io}
    port: ${MAIL_PORT:2525}
    username: ${MAIL_USERNAME:placeholder}
    password: ${MAIL_PASSWORD:placeholder}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

app:
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  mail:
    from: ${MAIL_FROM:support@careerpilot-ai.ru}
  encryption:
    master-key: ${ENCRYPTION_MASTER_KEY:your-super-secret-master-key-32}
  google:
    redirect-uri: ${GOOGLE_CALENDAR_REDIRECT_URI:http://localhost:8080/api/integrations/google-calendar/callback}

reminder:
  scheduler:
    enabled: ${REMINDER_SCHEDULER_ENABLED:true}
    cron: ${REMINDER_SCHEDULER_CRON:0 0 * * * *}

security:
  jwt:
    secret: ${JWT_SECRET:Q2FyZWVyUGlsb3RBdXRoU2VjcmV0S2V5Rm9yRGV2RW52aXJvbm1lbnQxMjM0NTY3ODkwMTIzNDU2Nzg5MA==}
    access-token-expiration-ms: ${JWT_ACCESS_TOKEN_EXPIRATION_MS:3600000}
    refresh-token-expiration-ms: ${JWT_REFRESH_TOKEN_EXPIRATION_MS:604800000}

telegram:
  bot:
    enabled: ${TELEGRAM_BOT_ENABLED:true}
    token: ${TELEGRAM_BOT_TOKEN:placeholder}
    username: ${TELEGRAM_BOT_USERNAME:careerpilot_ai_bot}
    webhook-url: ${TELEGRAM_WEBHOOK_URL:}
    webapp-url: ${TELEGRAM_WEBAPP_URL:https://careerpilot-ai.ru/app/dashboard?tg=1}
  miniapp:
    name: ${TELEGRAM_MINIAPP_NAME:app}

hh:
  client-id: ${HH_CLIENT_ID:}
  client-secret: ${HH_CLIENT_SECRET:}
  redirect-uri: ${HH_REDIRECT_URI:http://localhost:8080/api/integration/hh/callback}
